<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>LOCI – Mất kết nối</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7f7; color: #222;
    font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: #fff; border-radius: 24px; padding: 32px 24px; max-width: 360px; width: 100%; text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06); display: grid; gap: 12px; justify-items: center; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 1.25rem; margin: 4px 0 0; letter-spacing: -.02em; font-weight: 600; }
  p { margin: 0; color: #6a6a6a; }
  button { margin-top: 8px; border: 0; border-radius: 12px; background: #0e6a5b; color: #fff; font: inherit; font-weight: 600;
    padding: 14px 20px; width: 100%; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>Không có kết nối mạng</h1>
    <p>Số liệu LOCI luôn lấy trực tiếp từ máy chủ. Hãy kiểm tra Wi-Fi hoặc 4G rồi thử lại.</p>
    <button onclick="location.reload()">Thử lại</button>
  </div>
</body>
</html>
